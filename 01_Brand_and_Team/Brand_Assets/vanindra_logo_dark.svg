<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 140" width="740" height="140" role="img" aria-label="VanIndra Creation Official Logo (Dark Slate Edition)">
  <defs>
    <linearGradient id="bgSlateVI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#1B2029"/>
    </linearGradient>
    <linearGradient id="titaniumVI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="78%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="silverRingVI" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Architectural Slate Background -->
  <rect width="740" height="140" rx="16" fill="url(#bgSlateVI)"/>

  <!-- Minimal Icon Badge: Geometric VI Monogram + Studio Circle Frame + Play Accent -->
  <g transform="translate(80, 70)">
    <!-- Outer Titanium Ring -->
    <circle cx="0" cy="0" r="43" fill="#14181F" stroke="url(#silverRingVI)" stroke-width="4.5"/>
    <!-- Inner Subtle Ring -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#334155" stroke-width="1.2"/>
    <!-- Geometric 'V' -->
    <path d="M -21 -16 L -8 17 L 5 -16" fill="none" stroke="url(#titaniumVI)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Geometric 'I' Pillar -->
    <line x1="16" y1="-16" x2="16" y2="16" stroke="url(#titaniumVI)" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Micro Play Spark Accent on Top Right -->
    <polygon points="24,-6 32,0 24,6" fill="#F8FAFC"/>
  </g>

  <!-- Bold Agency Wordmark: VANINDRA CREATION -->
  <text x="146" y="84" font-family="'Space Grotesk', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="40" letter-spacing="2.5">
    <tspan fill="#F8FAFC" font-weight="800">VANINDRA</tspan><tspan fill="#CBD5E1" font-weight="300"> CREATION</tspan>
  </text>
</svg>
